<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Serviços - Ramos Jardinagem</title>
    <style>
        :root {
            --verde-escuro: #2d5a27;
            --verde-claro: #8eb057;
            --pendente: #f39c12;
            --concluido: #27ae60;
            --fundo: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--fundo); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { color: var(--verde-escuro); margin: 0; }

        .controles { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #eee; padding: 12px; text-align: left; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }

        .status-badge { padding: 5px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; color: white; }
        .status-agendado { background: var(--pendente); }
        .status-concluido { background: var(--concluido); }

        .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; font-size: 12px; }
        .btn-whats { background: #25d366; color: white; }
        .btn-save { background: var(--verde-escuro); color: white; }
        
        tr:hover { background: #f9f9f9; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>📅 Agenda de Serviços</h2>
        <a href="painel.html" style="text-decoration: none; color: #666; font-size: 14px;">⬅ Voltar ao Painel</a>
    </header>

    <div class="controles">
        <input type="date" id="filtroData" onchange="carregarAgenda()">
        <select id="filtroStatus" onchange="carregarAgenda()">
            <option value="">Todos os Status</option>
            <option value="Agendado">Agendado</option>
            <option value="Concluido">Concluído</option>
        </select>
    </div>

    <table id="tabelaAgenda">
        <thead>
            <tr>
                <th>DATA</th>
                <th>CLIENTE</th>
                <th>ENDEREÇO</th>
                <th>STATUS</th>
                <th>AÇÕES</th>
            </tr>
        </thead>
        <tbody id="corpoAgenda">
            </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://dxlsknikveslsupngshw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4bHNrbmlrdmVzbHN1cG5nc2h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjA5MjAsImV4cCI6MjA4ODYzNjkyMH0.ffcYhfmi_lYNAPCsPqyfUxexmfsxR_HOS36QtKzL3HM';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function carregarAgenda() {
        let { data, error } = await _supabase.from('indicacoes').select('*').order('data_agendamento', { ascending: true });
        
        const filtroData = document.getElementById('filtroData').value;
        const filtroStatus = document.getElementById('filtroStatus').value;
        const corpo = document.getElementById('corpoAgenda');
        corpo.innerHTML = '';

        data.forEach(item => {
            // Lógica de filtros simples
            if (filtroData && item.data_agendamento !== filtroData) return;
            if (filtroStatus && item.status_servico !== filtroStatus) return;

            const dataFormatada = item.data_agendamento ? new Date(item.data_agendamento).toLocaleDateString('pt-BR') : 'Definir data';
            const msgZap = encodeURIComponent(`Olá ${item.nome_cliente}, aqui é da Ramos Jardinagem! Confirmando nosso serviço agendado para o dia ${dataFormatada}. Podemos ir?`);

            corpo.innerHTML += `
                <tr>
                    <td><input type="date" value="${item.data_agendamento || ''}" onchange="atualizarData(${item.id}, this.value)"></td>
                    <td><strong>${item.nome_cliente}</strong></td>
                    <td><small>${item.endereco_cliente}</small></td>
                    <td>
                        <select onchange="atualizarStatus(${item.id}, this.value)">
                            <option value="Agendado" ${item.status_servico === 'Agendado' ? 'selected' : ''}>Agendado</option>
                            <option value="Concluido" ${item.status_servico === 'Concluido' ? 'selected' : ''}>Concluído</option>
                        </select>
                    </td>
                    <td>
                        <a href="https://wa.me/55${item.telefone_cliente.replace(/\D/g,'')}?text=${msgZap}" target="_blank" class="btn btn-whats">Avisar Cliente</a>
                    </td>
                </tr>
            `;
        });
    }

    async function atualizarData(id, novaData) {
        await _supabase.from('indicacoes').update({ data_agendamento: novaData }).eq('id', id);
        carregarAgenda();
    }

    async function atualizarStatus(id, novoStatus) {
        await _supabase.from('indicacoes').update({ status_servico: novoStatus }).eq('id', id);
        carregarAgenda();
    }

    carregarAgenda();
</script>
</body>
</html>
