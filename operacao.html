<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Individual - Ramos Jardinagem</title>
    <style>
        :root {
            --verde-escuro: #2d5a27;
            --fundo: #f0f2f5;
            --perigo: #c0392b;
            --sucesso: #27ae60;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fundo); margin: 0; padding: 15px; }
        .container { max-width: 1350px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        
        .resumo-financeiro { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card-financeiro { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; }
        .card-financeiro strong { font-size: 1.3rem; color: var(--verde-escuro); display: block; }

        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: var(--verde-escuro); color: white; padding: 10px; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        
        .worker-box { display: flex; gap: 5px; margin-bottom: 3px; align-items: center; }
        .input-name { width: 120px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .select-type { padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .input-val-total { width: 90px; font-weight: bold; padding: 8px; border: 1px solid var(--verde-escuro); border-radius: 5px; text-align: center; }
        
        .badge-lucro { background: #e8f5e9; color: var(--sucesso); padding: 10px; border-radius: 5px; font-weight: bold; display: block; text-align: center; font-size: 14px; }
        .status-save { font-size: 10px; color: #999; display: block; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 style="color: var(--verde-escuro); margin: 0;">💰 Pagamento de Equipes e Lucro</h2>
        <a href="agenda.html" style="text-decoration: none; color: #666; font-weight: bold;">⬅ Voltar</a>
    </header>

    <div class="resumo-financeiro">
        <div class="card-financeiro"><span>FATURAMENTO</span><strong id="brutoTotal">R$ 0,00</strong></div>
        <div class="card-financeiro"><span>TOTAL DIÁRIAS</span><strong id="custoTotal" style="color: var(--perigo);">R$ 0,00</strong></div>
        <div class="card-financeiro"><span>LUCRO LÍQUIDO</span><strong id="lucroTotal" style="color: var(--sucesso);">R$ 0,00</strong></div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="text-align: left;">CLIENTE</th>
                <th>VALOR COBRADO</th>
                <th>EQUIPE DESIGNADA (Nome / Tipo)</th>
                <th>TOTAL M.O.</th>
                <th>LUCRO</th>
            </tr>
        </thead>
        <tbody id="corpoOperacao"></tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://dxlsknikveslsupngshw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4bHNrbmlrdmVzbHN1cG5nc2h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjA5MjAsImV4cCI6MjA4ODYzNjkyMH0.ffcYhfmi_lYNAPCsPqyfUxexmfsxR_HOS36QtKzL3HM';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const hoje = new Date().toISOString().split('T')[0];

    async function carregar() {
        let { data } = await _supabase.from('indicacoes').select('*').eq('data_agendamento', hoje);
        const corpo = document.getElementById('corpoOperacao');
        corpo.innerHTML = '';

        data.forEach(item => {
            const mo = (item.p1_valor || 0) + (item.p2_valor || 0) + (item.p3_valor || 0);
            const lucro = (item.valor_total_servico || 0) - mo;

            corpo.innerHTML += `
                <tr>
                    <td><strong>${item.nome_cliente}</strong><br><span id="st-${item.id}" class="status-save"></span></td>
                    <td style="text-align:center;">
                        <input type="number" class="input-val-total" id="v-${item.id}" value="${item.valor_total_servico || 0}" onblur="salvar(${item.id})">
                    </td>
                    <td>
                        <div class="worker-box">
                            <input type="text" class="input-name" id="p1n-${item.id}" placeholder="Nome 1" value="${item.p1_nome || ''}" onblur="salvar(${item.id})">
                            <select class="select-type" id="p1v-${item.id}" onchange="salvar(${item.id})">
                                <option value="0">Off</option>
                                <option value="100" ${item.p1_valor == 100 ? 'selected' : ''}>Oficial (100)</option>
                                <option value="60" ${item.p1_valor == 60 ? 'selected' : ''}>Ajudante (60)</option>
                            </select>
                        </div>
                        <div class="worker-box">
                            <input type="text" class="input-name" id="p2n-${item.id}" placeholder="Nome 2" value="${item.p2_nome || ''}" onblur="salvar(${item.id})">
                            <select class="select-type" id="p2v-${item.id}" onchange="salvar(${item.id})">
                                <option value="0">Off</option>
                                <option value="100" ${item.p2_valor == 100 ? 'selected' : ''}>Oficial (100)</option>
                                <option value="60" ${item.p2_valor == 60 ? 'selected' : ''}>Ajudante (60)</option>
                            </select>
                        </div>
                        <div class="worker-box">
                            <input type="text" class="input-name" id="p3n-${item.id}" placeholder="Nome 3" value="${item.p3_nome || ''}" onblur="salvar(${item.id})">
                            <select class="select-type" id="p3v-${item.id}" onchange="salvar(${item.id})">
                                <option value="0">Off</option>
                                <option value="100" ${item.p3_valor == 100 ? 'selected' : ''}>Oficial (100)</option>
                                <option value="60" ${item.p3_valor == 60 ? 'selected' : ''}>Ajudante (60)</option>
                            </select>
                        </div>
                    </td>
                    <td style="text-align:center; font-weight:bold;" id="mo-${item.id}">R$ ${mo.toFixed(2)}</td>
                    <td><span class="badge-lucro" id="lu-${item.id}">R$ ${lucro.toFixed(2)}</span></td>
                </tr>`;
        });
        totais();
    }

    async function salvar(id) {
        const dados = {
            valor_total_servico: parseFloat(document.getElementById(`v-${id}`).value) || 0,
            p1_nome: document.getElementById(`p1n-${id}`).value,
            p1_valor: parseFloat(document.getElementById(`p1v-${id}`).value),
            p2_nome: document.getElementById(`p2n-${id}`).value,
            p2_valor: parseFloat(document.getElementById(`p2v-${id}`).value),
            p3_nome: document.getElementById(`p3n-${id}`).value,
            p3_valor: parseFloat(document.getElementById(`p3v-${id}`).value)
        };

        document.getElementById(`st-${id}`).innerText = "Salvando...";
        const { error } = await _supabase.from('indicacoes').update(dados).eq('id', id);

        if (!error) {
            document.getElementById(`st-${id}`).innerText = "✅ Salvo";
            const mo = dados.p1_valor + dados.p2_valor + dados.p3_valor;
            document.getElementById(`mo-${id}`).innerText = `R$ ${mo.toFixed(2)}`;
            document.getElementById(`lu-${id}`).innerText = `R$ ${(dados.valor_total_servico - mo).toFixed(2)}`;
            totais();
        }
    }

    function totais() {
        let b = 0, c = 0;
        document.querySelectorAll('.input-val-total').forEach(i => b += parseFloat(i.value) || 0);
        document.querySelectorAll('[id^="mo-"]').forEach(td => c += parseFloat(td.innerText.replace('R$ ', '')) || 0);
        document.getElementById('brutoTotal').innerText = `R$ ${b.toFixed(2)}`;
        document.getElementById('custoTotal').innerText = `R$ ${c.toFixed(2)}`;
        document.getElementById('lucroTotal').innerText = `R$ ${(b - c).toFixed(2)}`;
    }

    carregar();
</script>
</body>
</html>
