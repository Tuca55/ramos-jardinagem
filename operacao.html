<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Equipes - Ramos Jardinagem</title>
    <style>
        :root {
            --verde-escuro: #2d5a27;
            --fundo: #f0f2f5;
            --perigo: #c0392b;
            --sucesso: #27ae60;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fundo); margin: 0; padding: 10px; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        
        .resumo-financeiro { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card-financeiro { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; }
        .card-financeiro strong { font-size: 1.3rem; color: var(--verde-escuro); display: block; }

        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background: var(--verde-escuro); color: white; padding: 10px; text-align: center; }
        td { padding: 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        .worker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; } /* Organiza em 2 colunas para não ficar muito alto */
        .worker-box { display: flex; gap: 3px; align-items: center; background: #f9f9f9; padding: 3px; border-radius: 4px; border: 1px solid #eee; }
        .input-name { width: 80px; padding: 4px; border: 1px solid #ccc; border-radius: 3px; font-size: 11px; }
        .select-type { padding: 3px; border: 1px solid #ccc; border-radius: 3px; font-size: 11px; cursor: pointer; }
        
        .input-val-total { width: 90px; font-weight: bold; padding: 8px; border: 2px solid var(--verde-escuro); border-radius: 5px; text-align: center; font-size: 13px; }
        .badge-lucro { background: #e8f5e9; color: var(--sucesso); padding: 10px; border-radius: 5px; font-weight: bold; display: block; text-align: center; font-size: 13px; }
        .status-save { font-size: 10px; color: #999; display: block; text-align: center; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 style="color: var(--verde-escuro); margin: 0;">💰 Operação e Pagamentos (Até 5 Pessoas)</h2>
        <a href="agenda.html" style="text-decoration: none; color: #666; font-weight: bold;">⬅ Voltar</a>
    </header>

    <div class="resumo-financeiro">
        <div class="card-financeiro"><span>FATURAMENTO</span><strong id="brutoTotal">R$ 0,00</strong></div>
        <div class="card-financeiro"><span>DIÁRIAS PAGAS</span><strong id="custoTotal" style="color: var(--perigo);">R$ 0,00</strong></div>
        <div class="card-financeiro" style="background: #e8f5e9;"><span>LUCRO LÍQUIDO</span><strong id="lucroTotal" style="color: var(--sucesso);">R$ 0,00</strong></div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="text-align: left;">CLIENTE</th>
                <th>VALOR COBRADO</th>
                <th>EQUIPE (NOME / DIÁRIA)</th>
                <th>CUSTO M.O.</th>
                <th>LUCRO</th>
            </tr>
        </thead>
        <tbody id="corpoOperacao"></tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://dxlsknikveslsupngshw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4bHNrbmlrdmVzbHN1cG5nc2h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjA5MjAsImV4cCI6MjA4ODYzNjkyMH0.ffcYhfmi_lYNAPCsPqyfUxexmfsxR_HOS36QtKzL3HM';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const hoje = new Date().toISOString().split('T')[0];

    async function carregar() {
        let { data } = await _supabase.from('indicacoes').select('*').eq('data_agendamento', hoje);
        const corpo = document.getElementById('corpoOperacao');
        corpo.innerHTML = '';

        data.forEach(item => {
            const mo = (item.p1_valor || 0) + (item.p2_valor || 0) + (item.p3_valor || 0) + (item.p4_valor || 0) + (item.p5_valor || 0);
            const lucro = (item.valor_total_servico || 0) - mo;

            corpo.innerHTML += `
                <tr>
                    <td><strong>${item.nome_cliente}</strong><br><span id="st-${item.id}" class="status-save"></span></td>
                    <td style="text-align:center;">
                        <input type="number" class="input-val-total" id="v-${item.id}" value="${item.valor_total_servico || 0}" oninput="calcLinha(${item.id})" onblur="salvar(${item.id})">
                    </td>
                    <td>
                        <div class="worker-grid">
                            ${renderWorker(item, 1)} ${renderWorker(item, 2)}
                            ${renderWorker(item, 3)} ${renderWorker(item, 4)}
                            ${renderWorker(item, 5)}
                        </div>
                    </td>
                    <td style="text-align:center; font-weight:bold; font-size:13px;" id="mo-${item.id}">R$ ${mo.toFixed(2)}</td>
                    <td><span class="badge-lucro" id="lu-${item.id}">R$ ${lucro.toFixed(2)}</span></td>
                </tr>`;
        });
        totais();
    }

    function renderWorker(item, num) {
        const val = item[`p${num}_valor`] || 0;
        return `
            <div class="worker-box">
                <input type="text" class="input-name" id="p${num}n-${item.id}" placeholder="Nome ${num}" value="${item[`p${num}_nome`] || ''}" onblur="salvar(${item.id})">
                <select class="select-type" id="p${num}v-${item.id}" onchange="calcLinha(${item.id}); salvar(${item.id})">
                    <option value="0">Off</option>
                    <option value="100" ${val == 100 ? 'selected' : ''}>OF (100)</option>
                    <option value="60" ${val == 60 ? 'selected' : ''}>AJ (60)</option>
                </select>
            </div>`;
    }

    function calcLinha(id) {
        let mo = 0;
        for(let i=1; i<=5; i++) mo += parseFloat(document.getElementById(`p${i}v-${id}`).value) || 0;
        const v = parseFloat(document.getElementById(`v-${id}`).value) || 0;
        document.getElementById(`mo-${id}`).innerText = `R$ ${mo.toFixed(2)}`;
        document.getElementById(`lu-${id}`).innerText = `R$ ${(v - mo).toFixed(2)}`;
        totais();
    }

    async function salvar(id) {
        const dados = { valor_total_servico: parseFloat(document.getElementById(`v-${id}`).value) || 0 };
        for(let i=1; i<=5; i++) {
            dados[`p${i}_nome`] = document.getElementById(`p${i}n-${id}`).value;
            dados[`p${i}_valor`] = parseFloat(document.getElementById(`p${i}v-${id}`).value) || 0;
        }

        document.getElementById(`st-${id}`).innerText = "⏳ Gravando...";
        const { error } = await _supabase.from('indicacoes').update(dados).eq('id', id);
        if (!error) {
            document.getElementById(`st-${id}`).innerText = "✅ Salvo";
            setTimeout(() => { document.getElementById(`st-${id}`).innerText = ""; }, 2000);
        }
    }

    function totais() {
        let b = 0, c = 0;
        document.querySelectorAll('.input-val-total').forEach(i => b += parseFloat(i.value) || 0);
        document.querySelectorAll('[id^="mo-"]').forEach(td => c += parseFloat(td.innerText.replace('R$ ', '')) || 0);
        document.getElementById('brutoTotal').innerText = `R$ ${b.toFixed(2)}`;
        document.getElementById('custoTotal').innerText = `R$ ${c.toFixed(2)}`;
        document.getElementById('lucroTotal').innerText = `R$ ${(b - c).toFixed(2)}`;
    }

    carregar();
</script>
</body>
</html>
