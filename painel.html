<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Ramos Jardinagem</title>
    <style>
        :root {
            --verde-gestao: #1b4332;
            --verde-sucesso: #2d6a4f;
            --pendente: #d90429;
            --fundo: #f8f9fa;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--fundo); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        h2 { color: var(--verde-gestao); margin: 0; }

        /* Cartões de Resumo */
        .stats { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; flex: 1; border: 1px solid #e0e0e0; box-shadow: 2px 2px 5px rgba(0,0,0,0.02); }
        .card h3 { margin: 0; font-size: 13px; color: #888; text-transform: uppercase; }
        .card p { margin: 10px 0 0; font-size: 28px; font-weight: bold; color: var(--verde-gestao); }

        /* Filtro */
        .search-box { margin-bottom: 20px; width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }

        /* Tabela */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #f4f7f6; color: #444; padding: 15px; text-align: left; font-size: 13px; }
        td { padding: 15px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .badge-pendente { background: #ffe5ec; color: var(--pendente); }
        .badge-pago { background: #d8f3dc; color: var(--verde-sucesso); }

        /* Inputs e Botões */
        input[type="number"] { width: 90px; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-acao { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-salvar { background: var(--verde-gestao); color: white; margin-right: 5px; }
        .btn-whats { background: #25d366; color: white; text-decoration: none; font-size: 12px; padding: 8px 12px; border-radius: 6px; display: inline-block; }
        
        tr:hover { background-color: #f9fffb; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>🌿 Ramos Jardinagem | <span style="font-weight: normal; font-size: 18px;">Gestão de Parcerias</span></h2>
        <button onclick="carregarDados()" class="btn-acao" style="background:#eee">🔄 Atualizar</button>
    </header>
    
    <div class="stats">
        <div class="card">
            <h3>Serviços em Aberto</h3>
            <p id="totalServicos">R$ 0,00</p>
        </div>
        <div class="card">
            <h3>Comissões a Pagar</h3>
            <p id="totalComissoes" style="color: var(--pendente);">R$ 0,00</p>
        </div>
    </div>

    <input type="text" id="filtro" class="search-box" placeholder="🔍 Buscar por piscineiro ou cliente..." onkeyup="filtrarTabela()">

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>PARCEIRO</th>
                    <th>CLIENTE / LOCAL</th>
                    <th>VALOR SERVIÇO</th>
                    <th>COMISSÃO (10%)</th>
                    <th>STATUS</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'SUA_URL_AQUI';
    const SUPABASE_KEY = 'SUA_ANON_KEY_AQUI';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function carregarDados() {
        const { data, error } = await _supabase.from('indicacoes').select('*').order('created_at', { ascending: false });
        if (error) { alert('Erro ao carregar banco!'); return; }

        let somaServicos = 0;
        let somaComissoes = 0;
        const corpo = document.getElementById('tabelaCorpo');
        corpo.innerHTML = '';

        data.forEach(item => {
            const comissao = item.valor_servico * 0.10;
            if (!item.comissao_paga) {
                somaServicos += Number(item.valor_servico);
                somaComissoes += comissao;
            }

            const whatsLink = `https://wa.me/55${item.whatsapp_piscineiro.replace(/\D/g,'')}?text=Olá ${item.nome_piscineiro}, aqui é da Ramos Jardinagem!`;

            corpo.innerHTML += `
                <tr class="linha-dados">
                    <td style="font-size: 12px; color: #777;">${new Date(item.created_at).toLocaleDateString('pt-BR')}</td>
                    <td>
                        <strong>${item.nome_piscineiro}</strong><br>
                        <a href="${whatsLink}" target="_blank" class="btn-whats">WhatsApp</a>
                    </td>
                    <td>
                        <strong>${item.nome_cliente}</strong><br>
                        <small style="color:#888">${item.endereco_cliente}</small>
                    </td>
                    <td>R$ <input type="number" id="val-${item.id}" value="${item.valor_servico}" step="0.10"></td>
                    <td style="font-weight:bold; color: var(--verde-sucesso)">R$ ${comissao.toFixed(2)}</td>
                    <td>
                        <span class="badge ${item.comissao_paga ? 'badge-pago' : 'badge-pendente'}">
                            ${item.comissao_paga ? 'PAGO' : 'PENDENTE'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-acao btn-salvar" onclick="atualizar(${item.id})">Salvar R$</button>
                        ${!item.comissao_paga ? `<button class="btn-acao" onclick="pagar(${item.id})" style="background:#000; color:#fff">💸 Pagar</button>` : '✅'}
                    </td>
                </tr>
            `;
        });

        document.getElementById('totalServicos').innerText = `R$ ${somaServicos.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;
        document.getElementById('totalComissoes').innerText = `R$ ${somaComissoes.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;
    }

    async function atualizar(id) {
        const novoValor = document.getElementById(`val-${id}`).value;
        await _supabase.from('indicacoes').update({ valor_servico: novoValor }).eq('id', id);
        carregarDados();
    }

    async function pagar(id) {
        if(confirm('Confirmar que a comissão foi paga para o parceiro?')) {
            await _supabase.from('indicacoes').update({ comissao_paga: true }).eq('id', id);
            carregarDados();
        }
    }

    function filtrarTabela() {
        const input = document.getElementById('filtro').value.toUpperCase();
        const linhas = document.getElementsByClassName('linha-dados');
        for (let i = 0; i < linhas.length; i++) {
            linhas[i].style.display = linhas[i].innerText.toUpperCase().includes(input) ? "" : "none";
        }
    }

    carregarDados();
</script>
</body>
</html>
